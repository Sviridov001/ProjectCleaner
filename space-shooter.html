<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space Shooter — opencode</title>
<style>
  :root { --bg:#05060f; --fg:#cfe8ff; --accent:#4fd6ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace; }
  #wrap { display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px; }
  h1 { font-size:18px; letter-spacing:1px; margin:4px 0; }
  .sig { color:var(--accent); font-size:12px; opacity:.85; }
  #hud { display:flex; gap:24px; font-size:14px; }
  #hud b { color:var(--accent); }
  canvas { background:#02030a; border:1px solid #1b2a44; border-radius:8px;
    box-shadow:0 0 40px rgba(79,214,255,.12) inset; touch-action:none; }
  #hint { font-size:12px; opacity:.7; }
  button { background:#0c1830; color:var(--fg); border:1px solid #25406a;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-family:inherit; }
  button:hover { border-color:var(--accent); }
</style>
</head>
<body>
<div id="wrap">
  <h1>★ SPACE SHOOTER ★</h1>
  <div class="sig">сделано opencode</div>
  <div id="hud"><span>Очки: <b id="score">0</b></span><span>Жизни: <b id="lives">3</b></span><span>Волна: <b id="wave">1</b></span></div>
  <canvas id="game" width="480" height="640"></canvas>
  <div id="hint">Стрелки / A,D — двигаться · Пробел — стрелять · P — пауза · R — рестарт</div>
  <button id="restart">Новая игра</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const waveEl  = document.getElementById('wave');

  const keys = {};
  let bullets = [], enemies = [], stars = [], particles = [];
  let player, score, lives, wave, paused, over, lastShot, spawnTimer, raf;

  for (let i = 0; i < 90; i++)
    stars.push({ x: Math.random()*W, y: Math.random()*H, z: Math.random()*2+0.4 });

  function reset() {
    player = { x: W/2, y: H-60, w: 30, h: 26, speed: 5 };
    bullets = []; enemies = []; particles = [];
    score = 0; lives = 3; wave = 1; paused = false; over = false;
    lastShot = 0; spawnTimer = 0;
    scoreEl.textContent = score; livesEl.textContent = lives; waveEl.textContent = wave;
  }

  function spawnEnemy() {
    const r = 14 + Math.random()*10;
    enemies.push({
      x: r + Math.random()*(W-2*r), y: -r, r,
      vy: 1 + Math.random()*1.4 + wave*0.15,
      vx: (Math.random()-0.5)*1.2, hp: 1 + (wave>3?1:0)
    });
  }

  function burst(x, y, color) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random()*Math.PI*2, s = Math.random()*3+1;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30, color });
    }
  }

  function shoot() {
    const t = performance.now();
    if (t - lastShot < 220) return;
    lastShot = t;
    bullets.push({ x: player.x, y: player.y - player.h/2, vy: -9, r: 3 });
  }

  function update(dt) {
    for (const s of stars) { s.y += s.z*0.6; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } }

    if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
    if (keys['ArrowRight']|| keys['d']) player.x += player.speed;
    player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));

    for (const b of bullets) b.y += b.vy;
    bullets = bullets.filter(b => b.y > -10);

    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(380, 1100 - wave*70); }

    for (const e of enemies) { e.y += e.vy; e.x += e.vx; if (e.x < e.r || e.x > W-e.r) e.vx *= -1; }

    for (const b of bullets) {
      for (const e of enemies) {
        if (e.hp > 0 && Math.hypot(b.x-e.x, b.y-e.y) < e.r + b.r) {
          b.y = -100; e.hp--;
          if (e.hp <= 0) { score += 10; burst(e.x, e.y, '#4fd6ff'); e.dead = true; }
          else burst(e.x, e.y, '#ffd166');
        }
      }
    }

    for (const e of enemies) {
      if (!e.dead && Math.hypot(e.x-player.x, e.y-player.y) < e.r + player.w/2) {
        e.dead = true; lives--; burst(player.x, player.y, '#ff5d73');
        burst(e.x, e.y, '#4fd6ff');
      }
      if (!e.dead && e.y - e.r > H) e.dead = true;
    }
    enemies = enemies.filter(e => !e.dead);
    scoreEl.textContent = score; livesEl.textContent = lives;

    if (score >= wave*100) { wave++; waveEl.textContent = wave; }

    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; }
    particles = particles.filter(p => p.life > 0);

    if (lives <= 0) over = true;
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#cfe8ff';
    for (const s of stars) { ctx.globalAlpha = s.z/2.4; ctx.fillRect(s.x, s.y, s.z, s.z); }
    ctx.globalAlpha = 1;

    if (!over) {
      ctx.fillStyle = '#4fd6ff';
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - player.h/2);
      ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
      ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#0a1430'; ctx.fillRect(player.x-3, player.y-player.h/2, 6, 8);
    }

    ctx.fillStyle = '#ffd166';
    for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); }

    for (const e of enemies) {
      ctx.fillStyle = '#ff5d73';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#2a0b12'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r*0.45, 0, 7); ctx.fill();
    }

    for (const p of particles) {
      ctx.globalAlpha = p.life/30; ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 2, 2);
    }
    ctx.globalAlpha = 1;

    if (paused && !over) banner('ПАУЗА', '#cfe8ff');
    if (over) banner('ИГРА ОКОНЧЕНА · R — рестарт', '#ff5d73');
  }

  function banner(text, color) {
    ctx.fillStyle = color; ctx.font = '16px ui-monospace, monospace';
    ctx.textAlign = 'center'; ctx.fillText(text, W/2, H/2); ctx.textAlign = 'left';
  }

  let prev = 0;
  function loop(t) {
    const dt = Math.min(50, t - prev || 16); prev = t;
    if (!paused && !over) update(dt);
    draw();
    raf = requestAnimationFrame(loop);
  }

  addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') { e.preventDefault(); if (!paused && !over) shoot(); }
    if (e.key.toLowerCase() === 'p') paused = !paused;
    if (e.key.toLowerCase() === 'r') { reset(); }
  });
  addEventListener('keyup', e => keys[e.key] = false);
  document.getElementById('restart').onclick = reset;

  reset();
  raf = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
