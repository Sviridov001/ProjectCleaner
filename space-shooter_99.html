<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOVA STRIKE — space-shooter_99</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#02030a; display:flex; justify-content:center; align-items:center;
         height:100vh; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; }
  canvas { display:block; image-rendering:auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C = document.getElementById('c');
const X = C.getContext('2d');
let W, H;

function resize() {
  const r = window.devicePixelRatio || 1;
  W = Math.min(window.innerWidth, 600);
  H = Math.min(window.innerHeight, 900);
  C.width = W * r; C.height = H * r;
  C.style.width = W + 'px'; C.style.height = H + 'px';
  X.setTransform(r, 0, 0, r, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const keys = {};
let frame = 0;
let shake = 0;

// Stars - 3 layers
const stars = [];
for (let l = 0; l < 3; l++) {
  for (let i = 0; i < 50 - l * 10; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      speed: (l + 1) * 0.4 + 0.2,
      size: (l + 1) * 0.6 + 0.3,
      layer: l,
      phase: Math.random() * Math.PI * 2
    });
  }
}

// Nebula blobs
const nebula = [];
const NEB_COLORS = ['rgba(100,60,200,0.08)','rgba(40,100,200,0.06)','rgba(200,60,120,0.05)','rgba(60,180,140,0.05)'];
for (let i = 0; i < 5; i++) {
  nebula.push({
    x: Math.random() * W, y: Math.random() * H,
    r: 100 + Math.random() * 180,
    color: NEB_COLORS[i % NEB_COLORS.length]
  });
}

// Game state
let state = 'menu'; // menu | play | over
let score = 0, best = 0, wave = 0, lives = 3, combo = 0, mult = 1;
let lastShot = 0, spawnTimer = 0, frameAlive = 0;
let screenFlash = 0, flashColor = '#fff';

// Entities
let player, bullets, enemies, particles, explosions, powerups, enemyBullets;

function initGame() {
  player = { x: W / 2, y: H - 100, w: 36, h: 36, speed: 5, inv: 90, shield: 0, triple: 0, rapid: 0 };
  bullets = []; enemies = []; particles = []; explosions = []; powerups = []; enemyBullets = [];
  score = 0; wave = 0; lives = 3; combo = 0; mult = 1;
  lastShot = 0; spawnTimer = 60; frameAlive = 0;
  shake = 0; screenFlash = 0;
  state = 'play';
}

// Effects
function addExplosion(x, y, color, scale) {
  scale = scale || 1;
  // Flash
  explosions.push({ x, y, r: 0, maxR: 50 * scale, life: 18, maxLife: 18, color });
  // Ring
  explosions.push({ x, y, r: 0, maxR: 70 * scale, life: 28, maxLife: 28, color, ring: true });
  // Sparks
  for (let i = 0; i < 14 * scale; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (Math.random() * 0.7 + 0.3) * 5 * scale;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 25 + Math.random() * 15, maxLife: 40,
      size: 1.5 + Math.random() * 2, color
    });
  }
  // Smoke
  for (let i = 0; i < 4 * scale; i++) {
    particles.push({
      x: x + (Math.random() - 0.5) * 12, y: y + (Math.random() - 0.5) * 12,
      vx: (Math.random() - 0.5) * 0.5, vy: -(Math.random() * 0.8 + 0.2),
      life: 35 + Math.random() * 15, maxLife: 50,
      size: 5 + Math.random() * 8, color: 'rgba(120,130,160,0.4)', smoke: true
    });
  }
  shake = Math.min(12, shake + 4 * scale);
}

function addText(x, y, text, color, size) {
  particles.push({
    x, y, vx: 0, vy: -1.2, life: 40, maxLife: 40,
    text, color, size: size || 16, isText: true
  });
}

// Enemy types
function spawnEnemy() {
  wave = Math.max(1, Math.floor(score / 200) + 1);
  const types = ['basic'];
  if (wave >= 2) types.push('fast');
  if (wave >= 3) types.push('shooter');
  if (wave >= 4) types.push('tank');
  const type = types[Math.floor(Math.random() * types.length)];

  const defs = {
    basic:  { r: 16, hp: 1, speed: 1.2 + wave * 0.06, color: '#ff5d73', score: 10 },
    fast:   { r: 12, hp: 1, speed: 2.8 + wave * 0.1,  color: '#ff9f43', score: 15 },
    shooter:{ r: 18, hp: 2, speed: 0.8 + wave * 0.05,  color: '#38bdf8', score: 25 },
    tank:   { r: 22, hp: 4, speed: 0.6 + wave * 0.04,  color: '#f87171', score: 40 }
  };
  const d = defs[type];
  enemies.push({
    x: d.r + Math.random() * (W - d.r * 2), y: -d.r,
    r: d.r, hp: d.hp, maxHp: d.hp, speed: d.speed,
    vx: (Math.random() - 0.5) * 0.8, type, color: d.color, score: d.score,
    phase: Math.random() * Math.PI * 2, shootTimer: 80 + Math.random() * 60
  });
}

function shoot() {
  const t = performance.now();
  const rate = player.rapid > 0 ? 120 : 200;
  if (t - lastShot < rate) return;
  lastShot = t;

  bullets.push({ x: player.x, y: player.y - player.h / 2, vy: -11, r: 3, color: '#4fd6ff' });
  // Muzzle flash
  particles.push({
    x: player.x, y: player.y - player.h / 2 - 5,
    vx: 0, vy: -1, life: 6, maxLife: 6,
    size: 10, color: '#4fd6ff', glow: true
  });

  if (player.triple > 0) {
    bullets.push({ x: player.x - 12, y: player.y - player.h / 2 + 5, vx: -1.5, vy: -10, r: 3, color: '#60a5fa' });
    bullets.push({ x: player.x + 12, y: player.y - player.h / 2 + 5, vx: 1.5, vy: -10, r: 3, color: '#60a5fa' });
  }
}

function enemyShoot(e) {
  const a = Math.atan2(player.y - e.y, player.x - e.x);
  enemyBullets.push({
    x: e.x, y: e.y + e.r,
    vx: Math.cos(a) * 3, vy: Math.sin(a) * 3,
    r: 5, color: '#ff6b81'
  });
}

function hitPlayer() {
  if (player.inv > 0) return;
  if (player.shield > 0) {
    player.shield = 0;
    addExplosion(player.x, player.y, '#facc15', 0.6);
    addText(player.x, player.y - 30, 'SHIELD DOWN', '#facc15', 14);
    return;
  }
  lives--;
  player.inv = 120;
  combo = 0;
  addExplosion(player.x, player.y, '#ff4444', 1.2);
  screenFlash = 1;
  flashColor = '#ff2222';
  if (lives <= 0) {
    addExplosion(player.x, player.y, '#00ffcc', 2);
    best = Math.max(best, score);
    state = 'over';
  }
}

function dropPowerup(e) {
  if (Math.random() > 0.15) return;
  const roll = Math.random();
  const type = roll < 0.35 ? 'life' : roll < 0.65 ? 'triple' : roll < 0.85 ? 'shield' : 'rapid';
  powerups.push({ x: e.x, y: e.y, vy: 2, r: 12, type, life: 400 });
}

const PU_COLORS = { life: '#ff5c7a', triple: '#60a5fa', shield: '#facc15', rapid: '#a78bfa' };
const PU_NAMES = { life: '+1 LIFE', triple: 'TRIPLE!', shield: 'SHIELD!', rapid: 'RAPID!' };

function applyPowerup(p) {
  addExplosion(p.x, p.y, PU_COLORS[p.type], 0.5);
  addText(p.x, p.y - 20, PU_NAMES[p.type], PU_COLORS[p.type], 14);
  if (p.type === 'life') lives = Math.min(5, lives + 1);
  else if (p.type === 'triple') player.triple = 480;
  else if (p.type === 'shield') player.shield = 1;
  else if (p.type === 'rapid') player.rapid = 480;
}

function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax - aw / 2 < bx + bw / 2 && ax + aw / 2 > bx - bw / 2 &&
         ay - ah / 2 < by + bh / 2 && ay + ah / 2 > by - bh / 2;
}

// UPDATE
function update() {
  frame++;
  if (shake > 0) shake *= 0.85;
  if (screenFlash > 0) screenFlash *= 0.88;

  // Stars
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
  for (const n of nebula) {
    n.y += 0.03;
    if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random() * W; }
  }

  if (state !== 'play') return;
  frameAlive++;

  // Player movement
  if (keys['ArrowLeft'] || keys['KeyA'] || keys['a']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD'] || keys['d']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['KeyW'] || keys['w']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['KeyS'] || keys['s']) player.y += player.speed;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
  player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

  if (player.inv > 0) player.inv--;
  if (player.triple > 0) player.triple--;
  if (player.rapid > 0) player.rapid--;

  // Shoot
  if (keys[' '] || keys['Space']) shoot();

  // Spawn enemies
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(20, 70 - wave * 3);
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += (b.vx || 0);
    b.y += b.vy;
    if (b.y < -10 || b.x < -10 || b.x > W + 10) { bullets.splice(i, 1); continue; }

    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
        e.hp--;
        e.flash = 6;
        addExplosion(b.x, b.y, '#ffffaa', 0.2);
        bullets.splice(i, 1);

        if (e.hp <= 0) {
          combo++;
          mult = Math.min(5, 1 + Math.floor(combo / 5));
          const gain = e.score * mult;
          score += gain;
          addExplosion(e.x, e.y, e.color, 0.8);
          addText(e.x, e.y - 15, '+' + gain, mult >= 3 ? '#ffd700' : '#fff', 14);
          dropPowerup(e);
          enemies.splice(j, 1);
        }
        break;
      }
    }
  }

  // Enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.flash > 0) e.flash--;
    e.phase += 0.05;

    if (e.type === 'fast') {
      e.x += Math.sin(e.phase) * 1.5;
      e.y += e.speed;
    } else if (e.type === 'shooter') {
      if (e.y < 80) e.y += e.speed;
      else {
        e.x += Math.sin(e.phase) * 0.8;
        e.shootTimer--;
        if (e.shootTimer <= 0) {
          enemyShoot(e);
          e.shootTimer = 80 + Math.random() * 40;
        }
      }
    } else if (e.type === 'tank') {
      e.x += Math.sin(e.phase * 0.5) * 0.6;
      e.y += e.speed;
    } else {
      e.x += e.vx;
      e.y += e.speed;
      if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
    }

    // Off screen
    if (e.y > H + 30) { enemies.splice(i, 1); continue; }

    // Hit player
    if (rectHit(player.x, player.y, player.w * 0.5, player.h * 0.5, e.x, e.y, e.r, e.r)) {
      hitPlayer();
      addExplosion(e.x, e.y, e.color, 0.6);
      enemies.splice(i, 1);
    }
  }

  // Enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      enemyBullets.splice(i, 1); continue;
    }
    if (Math.hypot(b.x - player.x, b.y - player.y) < b.r + player.w * 0.3) {
      hitPlayer();
      enemyBullets.splice(i, 1);
    }
  }

  // Powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy;
    p.life--;
    if (p.life <= 0 || p.y > H + 20) { powerups.splice(i, 1); continue; }
    if (Math.hypot(p.x - player.x, p.y - player.y) < p.r + player.w * 0.5) {
      applyPowerup(p);
      powerups.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life--;
    if (p.isText) { p.y += p.vy; }
    else if (p.smoke) { p.x += p.vx; p.y += p.vy; p.size += 0.2; }
    else { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; }
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Explosions
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.life--;
    e.r = e.maxR * (1 - e.life / e.maxLife);
    if (e.life <= 0) explosions.splice(i, 1);
  }
}

// DRAW
function drawBg() {
  // Deep space
  X.fillStyle = '#05060f';
  X.fillRect(0, 0, W, H);

  // Nebula
  for (const n of nebula) {
    const g = X.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, n.color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    X.fillStyle = g;
    X.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
  }

  // Stars
  for (const s of stars) {
    const twinkle = 0.4 + s.layer * 0.2 + Math.sin(frame * 0.05 + s.phase) * 0.15;
    X.globalAlpha = twinkle;
    X.fillStyle = s.layer === 2 ? '#cfe8ff' : '#ffffff';
    X.fillRect(s.x, s.y, s.size, s.size);
  }
  X.globalAlpha = 1;
}

function drawPlayer() {
  if (state !== 'play') return;
  const blink = player.inv > 0 && Math.floor(frame / 6) % 2 === 0;
  if (blink) return;

  const px = player.x, py = player.y;

  // Engine glow
  X.globalCompositeOperation = 'lighter';
  const flicker = 0.7 + Math.random() * 0.5;
  const eg = X.createLinearGradient(px, py + player.h / 2, px, py + player.h / 2 + 25 * flicker);
  eg.addColorStop(0, 'rgba(255,200,80,0.9)');
  eg.addColorStop(0.5, 'rgba(255,80,30,0.5)');
  eg.addColorStop(1, 'rgba(255,30,60,0)');
  X.fillStyle = eg;
  X.beginPath();
  X.moveTo(px - 6, py + player.h / 2 - 2);
  X.lineTo(px + 6, py + player.h / 2 - 2);
  X.lineTo(px, py + player.h / 2 + 25 * flicker);
  X.closePath();
  X.fill();
  X.globalCompositeOperation = 'source-over';

  // Ship body
  X.save();
  X.translate(px, py);

  // Glow aura
  X.shadowColor = '#4fd6ff';
  X.shadowBlur = 15;

  X.fillStyle = '#4fd6ff';
  X.beginPath();
  X.moveTo(0, -player.h / 2);
  X.lineTo(-player.w / 2, player.h / 2);
  X.lineTo(-player.w / 4, player.h / 3);
  X.lineTo(0, player.h / 2);
  X.lineTo(player.w / 4, player.h / 3);
  X.lineTo(player.w / 2, player.h / 2);
  X.closePath();
  X.fill();

  X.shadowBlur = 0;

  // Cockpit
  X.fillStyle = '#0a1430';
  X.beginPath();
  X.moveTo(0, -player.h / 4);
  X.lineTo(-5, player.h / 5);
  X.lineTo(5, player.h / 5);
  X.closePath();
  X.fill();

  // Window shine
  X.fillStyle = 'rgba(255,255,255,0.4)';
  X.fillRect(-2, -player.h / 4 + 2, 4, 5);

  X.restore();

  // Shield
  if (player.shield > 0) {
    const sr = player.w * 0.85 + Math.sin(frame * 0.15) * 3;
    X.strokeStyle = 'rgba(250,204,21,0.8)';
    X.lineWidth = 2.5;
    X.beginPath();
    X.arc(px, py, sr, 0, Math.PI * 2);
    X.stroke();
    X.globalCompositeOperation = 'lighter';
    X.strokeStyle = 'rgba(250,204,21,0.2)';
    X.lineWidth = 6;
    X.beginPath();
    X.arc(px, py, sr + 3, 0, Math.PI * 2);
    X.stroke();
    X.globalCompositeOperation = 'source-over';
  }
}

function drawBullets() {
  X.globalCompositeOperation = 'lighter';
  for (const b of bullets) {
    // Glow
    const g = X.createRadialGradient(b.x, b.y, 0, b.x, b.y, 10);
    g.addColorStop(0, b.color + '88');
    g.addColorStop(1, b.color + '00');
    X.fillStyle = g;
    X.beginPath();
    X.arc(b.x, b.y, 10, 0, Math.PI * 2);
    X.fill();
    // Core
    X.fillStyle = '#fff';
    X.fillRect(b.x - 1.5, b.y - 5, 3, 10);
    X.fillStyle = b.color;
    X.fillRect(b.x - 2.5, b.y - 7, 5, 14);
  }
  X.globalCompositeOperation = 'source-over';
}

function drawEnemyBullets() {
  X.globalCompositeOperation = 'lighter';
  for (const b of enemyBullets) {
    X.fillStyle = 'rgba(255,80,100,0.3)';
    X.beginPath();
    X.arc(b.x, b.y, b.r * 1.5, 0, Math.PI * 2);
    X.fill();
    X.fillStyle = '#ffd9de';
    X.beginPath();
    X.arc(b.x, b.y, b.r * 0.6, 0, Math.PI * 2);
    X.fill();
  }
  X.globalCompositeOperation = 'source-over';
}

function drawEnemies() {
  for (const e of enemies) {
    X.save();
    X.translate(e.x, e.y);

    const glow = e.flash > 0;
    const col = glow ? '#fff' : e.color;

    // Glow aura
    X.shadowColor = e.color;
    X.shadowBlur = 12;

    if (e.type === 'tank') {
      X.fillStyle = col;
      X.beginPath();
      X.arc(0, 0, e.r, 0, Math.PI * 2);
      X.fill();
      X.fillStyle = glow ? '#fff' : '#991b1b';
      X.beginPath();
      X.arc(0, 0, e.r * 0.55, 0, Math.PI * 2);
      X.fill();
      // HP bar
      X.shadowBlur = 0;
      X.fillStyle = 'rgba(0,0,0,0.5)';
      X.fillRect(-e.r, -e.r - 8, e.r * 2, 4);
      X.fillStyle = '#ff4444';
      X.fillRect(-e.r, -e.r - 8, e.r * 2 * (e.hp / e.maxHp), 4);
    } else if (e.type === 'shooter') {
      X.fillStyle = col;
      X.beginPath();
      X.moveTo(0, -e.r);
      X.lineTo(e.r * 0.7, 0);
      X.lineTo(e.r * 0.4, e.r * 0.6);
      X.lineTo(-e.r * 0.4, e.r * 0.6);
      X.lineTo(-e.r * 0.7, 0);
      X.closePath();
      X.fill();
      X.fillStyle = glow ? '#fff' : '#e0f2fe';
      X.beginPath();
      X.arc(0, 0, 4, 0, Math.PI * 2);
      X.fill();
    } else if (e.type === 'fast') {
      X.fillStyle = col;
      X.beginPath();
      X.moveTo(0, e.r);
      X.lineTo(-e.r * 0.6, -e.r * 0.5);
      X.lineTo(0, -e.r);
      X.lineTo(e.r * 0.6, -e.r * 0.5);
      X.closePath();
      X.fill();
    } else {
      X.fillStyle = col;
      X.beginPath();
      X.arc(0, 0, e.r, 0, Math.PI * 2);
      X.fill();
      X.fillStyle = glow ? '#fff' : '#7f1d1d';
      X.beginPath();
      X.arc(0, 0, e.r * 0.5, 0, Math.PI * 2);
      X.fill();
    }

    X.shadowBlur = 0;
    X.restore();
  }
}

function drawExplosions() {
  X.globalCompositeOperation = 'lighter';
  for (const e of explosions) {
    const t = e.life / e.maxLife;
    if (e.ring) {
      X.globalAlpha = t * 0.8;
      X.strokeStyle = e.color;
      X.lineWidth = 3 * t + 1;
      X.beginPath();
      X.arc(e.x, e.y, Math.max(1, e.r), 0, Math.PI * 2);
      X.stroke();
    } else {
      X.globalAlpha = t;
      const g = X.createRadialGradient(e.x, e.y, 0, e.x, e.y, Math.max(1, e.r));
      g.addColorStop(0, e.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      X.fillStyle = g;
      X.beginPath();
      X.arc(e.x, e.y, Math.max(1, e.r), 0, Math.PI * 2);
      X.fill();
    }
  }
  X.globalCompositeOperation = 'source-over';
}

function drawParticles() {
  for (const p of particles) {
    const t = p.life / p.maxLife;
    if (p.isText) {
      X.globalAlpha = Math.min(1, p.life / 15);
      X.font = 'bold ' + p.size + 'px monospace';
      X.textAlign = 'center';
      X.strokeStyle = 'rgba(0,0,0,0.5)';
      X.lineWidth = 3;
      X.strokeText(p.text, p.x, p.y);
      X.fillStyle = p.color;
      X.fillText(p.text, p.x, p.y);
      X.textAlign = 'left';
    } else if (p.smoke) {
      X.globalAlpha = t * 0.3;
      X.fillStyle = p.color;
      X.beginPath();
      X.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      X.fill();
    } else if (p.glow) {
      X.globalCompositeOperation = 'lighter';
      X.globalAlpha = t;
      const g = X.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      g.addColorStop(0, p.color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      X.fillStyle = g;
      X.beginPath();
      X.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      X.fill();
      X.globalCompositeOperation = 'source-over';
    } else {
      X.globalCompositeOperation = 'lighter';
      X.globalAlpha = t;
      X.strokeStyle = p.color;
      X.lineWidth = p.size;
      X.beginPath();
      X.moveTo(p.x, p.y);
      X.lineTo(p.x - p.vx * 3, p.y - p.vy * 3);
      X.stroke();
      X.globalCompositeOperation = 'source-over';
    }
  }
  X.globalAlpha = 1;
}

function drawPowerups() {
  for (const p of powerups) {
    const col = PU_COLORS[p.type];
    const pulse = 1 + Math.sin(frame * 0.12) * 0.1;
    const blink = p.life < 100 && Math.floor(frame / 6) % 2 === 0;
    if (blink) continue;

    X.save();
    X.translate(p.x, p.y);
    X.scale(pulse, pulse);

    // Glow
    X.globalCompositeOperation = 'lighter';
    const g = X.createRadialGradient(0, 0, 0, 0, 0, p.r * 1.8);
    g.addColorStop(0, col + '44');
    g.addColorStop(1, col + '00');
    X.fillStyle = g;
    X.beginPath();
    X.arc(0, 0, p.r * 1.8, 0, Math.PI * 2);
    X.fill();
    X.globalCompositeOperation = 'source-over';

    // Box
    X.fillStyle = col;
    X.strokeStyle = 'rgba(255,255,255,0.6)';
    X.lineWidth = 1.5;
    X.fillRect(-p.r / 2, -p.r / 2, p.r, p.r);
    X.strokeRect(-p.r / 2, -p.r / 2, p.r, p.r);

    // Icon
    X.fillStyle = '#fff';
    X.font = 'bold 12px monospace';
    X.textAlign = 'center';
    const icons = { life: '\u2665', triple: '\u25B2', shield: '\u25C6', rapid: '\u25B6' };
    X.fillText(icons[p.type], 0, 4);
    X.textAlign = 'left';

    X.restore();
  }
}

function drawHud() {
  // Score
  X.fillStyle = '#fff';
  X.font = 'bold 22px monospace';
  X.textAlign = 'left';
  X.fillText('SCORE ' + score, 16, 32);

  // Best
  X.fillStyle = 'rgba(255,255,255,0.4)';
  X.font = '12px monospace';
  X.fillText('BEST ' + best, 16, 50);

  // Lives
  for (let i = 0; i < lives; i++) {
    X.fillStyle = '#ff5c7a';
    X.font = '18px serif';
    X.fillText('\u2665', 16 + i * 22, 72);
  }

  // Wave
  X.fillStyle = '#a78bfa';
  X.font = 'bold 16px monospace';
  X.textAlign = 'right';
  X.fillText('WAVE ' + wave, W - 16, 32);
  X.textAlign = 'left';

  // Combo
  if (combo > 3) {
    const prog = (combo % 5) / 5;
    X.fillStyle = 'rgba(255,255,255,0.1)';
    X.fillRect(W - 130, 48, 110, 5);
    X.fillStyle = mult >= 4 ? '#ffd700' : '#ff9f43';
    X.fillRect(W - 130, 48, 110 * prog, 5);
    X.font = '11px monospace';
    X.textAlign = 'right';
    X.fillStyle = '#fff';
    X.fillText('COMBO ' + combo + '  x' + mult, W - 16, 68);
    X.textAlign = 'left';
  }

  // Timers
  let ty = 86;
  if (player.triple > 0) {
    X.fillStyle = '#60a5fa';
    X.fillRect(W - 130, ty, (player.triple / 480) * 110, 4);
    X.font = '10px monospace';
    X.textAlign = 'right';
    X.fillText('TRIPLE', W - 16, ty + 14);
    X.textAlign = 'left';
    ty += 20;
  }
  if (player.rapid > 0) {
    X.fillStyle = '#a78bfa';
    X.fillRect(W - 130, ty, (player.rapid / 480) * 110, 4);
    X.font = '10px monospace';
    X.textAlign = 'right';
    X.fillText('RAPID', W - 16, ty + 14);
    X.textAlign = 'left';
  }
}

function drawMenu() {
  drawBg();

  X.textAlign = 'center';

  // Title
  const pulse = 1 + Math.sin(frame * 0.04) * 0.03;
  X.save();
  X.translate(W / 2, H * 0.28);
  X.scale(pulse, pulse);

  X.shadowColor = '#4fd6ff';
  X.shadowBlur = 30;
  X.fillStyle = '#4fd6ff';
  X.font = 'bold 48px monospace';
  X.fillText('NOVA STRIKE', 0, 0);
  X.shadowBlur = 0;

  X.restore();

  X.fillStyle = 'rgba(255,255,255,0.6)';
  X.font = '14px monospace';
  X.fillText('space-shooter_99', W / 2, H * 0.28 + 30);

  // Best score
  if (best > 0) {
    X.fillStyle = '#ffd700';
    X.font = '16px monospace';
    X.fillText('BEST: ' + best, W / 2, H * 0.28 + 58);
  }

  // Controls
  const cy = H * 0.5;
  X.fillStyle = '#a78bfa';
  X.font = 'bold 15px monospace';
  X.fillText('CONTROLS', W / 2, cy);

  X.fillStyle = 'rgba(255,255,255,0.6)';
  X.font = '13px monospace';
  const ctrl = ['WASD / ARROWS - move', 'SPACE - shoot', 'P - pause', 'R - restart'];
  ctrl.forEach((c, i) => X.fillText(c, W / 2, cy + 28 + i * 22));

  // Start prompt
  X.fillStyle = '#4fd6ff';
  X.font = 'bold 18px monospace';
  const blink = Math.floor(frame / 30) % 2 === 0;
  if (blink) X.fillText('PRESS SPACE TO START', W / 2, H * 0.82);

  X.textAlign = 'left';
}

function drawPause() {
  X.fillStyle = 'rgba(0,0,0,0.6)';
  X.fillRect(0, 0, W, H);
  X.textAlign = 'center';
  X.fillStyle = '#fff';
  X.font = 'bold 40px monospace';
  X.fillText('PAUSED', W / 2, H / 2 - 20);
  X.font = '14px monospace';
  X.fillStyle = 'rgba(255,255,255,0.7)';
  X.fillText('P / ESC - resume', W / 2, H / 2 + 20);
  X.fillText('R - restart', W / 2, H / 2 + 46);
  X.textAlign = 'left';
}

function drawGameOver() {
  X.fillStyle = 'rgba(0,0,0,0.75)';
  X.fillRect(0, 0, W, H);
  X.textAlign = 'center';

  X.fillStyle = '#ff4444';
  X.font = 'bold 42px monospace';
  X.fillText('GAME OVER', W / 2, H * 0.28);

  X.fillStyle = '#fff';
  X.font = '20px monospace';
  X.fillText('Score: ' + score, W / 2, H * 0.28 + 40);

  if (score >= best) {
    X.fillStyle = '#ffd700';
    X.font = '16px monospace';
    X.fillText('NEW BEST!', W / 2, H * 0.28 + 66);
  } else {
    X.fillStyle = 'rgba(255,255,255,0.5)';
    X.font = '14px monospace';
    X.fillText('Best: ' + best, W / 2, H * 0.28 + 66);
  }

  X.fillStyle = 'rgba(255,255,255,0.7)';
  X.font = '14px monospace';
  X.fillText('Wave: ' + wave + '  |  Max combo: x' + mult, W / 2, H * 0.28 + 96);

  X.fillStyle = '#4fd6ff';
  X.font = 'bold 16px monospace';
  X.fillText('R - restart  |  M - menu', W / 2, H * 0.75);

  X.textAlign = 'left';
}

function draw() {
  X.save();
  if (shake > 0.5) X.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  if (state === 'menu') { drawMenu(); X.restore(); return; }

  drawBg();
  drawPowerups();
  drawBullets();
  drawEnemyBullets();
  drawEnemies();
  drawPlayer();
  drawExplosions();
  drawParticles();
  drawHud();

  // Screen flash
  if (screenFlash > 0.05) {
    X.globalAlpha = screenFlash * 0.3;
    X.fillStyle = flashColor;
    X.fillRect(0, 0, W, H);
    X.globalAlpha = 1;
  }

  if (state === 'over') drawGameOver();

  X.restore();
}

let paused = false;

function loop() {
  if (state === 'play' && !paused) update();
  else if (state === 'menu' || state === 'over') {
    // Animate bg in menu/over
    for (const s of stars) { s.y += s.speed; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
    for (const n of nebula) { n.y += 0.03; if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random() * W; } }
  }
  draw();
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();

  if (state === 'menu' && e.key === ' ') initGame();
  else if (state === 'over') {
    if (e.key.toLowerCase() === 'r') initGame();
    else if (e.key.toLowerCase() === 'm') state = 'menu';
  } else if (state === 'play') {
    if (e.key.toLowerCase() === 'p') paused = !paused;
    else if (e.key === 'Escape') paused = !paused;
    else if (e.key.toLowerCase() === 'r') { initGame(); paused = false; }
    else if (e.key.toLowerCase() === 'm') { state = 'menu'; paused = false; }
  }
});

addEventListener('keyup', e => { keys[e.key] = false; });

requestAnimationFrame(loop);
</script>
</body>
</html>
